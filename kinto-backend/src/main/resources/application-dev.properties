spring.application.name=kinto-backend
spring.config.import=file:./.env[.properties],file:.env[.properties]

server.port=8080
server.servlet.context-path=${DEFAULT_ROOT}
spring.servlet.encoding.charset=UTF-8
#spring.web.error.include-message=always

# --------- Database -----------
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database=postgresql
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

#spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:sql/data.sql
#spring.sql.init.continue-on-error=false
#logging.level.org.springframework.jdbc.datasource.init=DEBUG

#spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.jdbc.batch_size=15
spring.jpa.properties.hibernate.order_inserts=true

jwt.secret.access=${JWT_SECRET_ACCESS}
jwt.secret.refresh=${JWT_SECRET_REFRESH}
jwt.refresh.ttl=30d

verification.email.ttl=1d

logging.charset.console=UTF-8

spring.servlet.multipart.max-file-size=8MB

# --------- Mail -----------
spring.mail.host=smtp.yandex.ru
spring.mail.protocol=smtp
spring.mail.port=587
spring.mail.from=${MAIL_SENDER_USERNAME}
spring.mail.username=${MAIL_SENDER_USERNAME}
spring.mail.password=${MAIL_SENDER_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# --------- RabbitMq -----------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}

# --------- MiniO -----------
app.minio.url=${MINIO_URL}
app.minio.access-key=${MINIO_ACCESS_KEY}
app.minio.secret-key=${MINIO_SECRET_KEY}


# --------- Redis -----------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=6000ms
spring.data.redis.password=${REDIS_PASSWORD}